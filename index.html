const CHAINS = {"0x1":"Ethereum mainnet","0x2105":"Base","0xa":"Optimism","0xa4b1":"Arbitrum","0x89":"Polygon","0xaa36a7":"Sepolia"};
const THEMES = ["hero","band","who","gen","reg","docs","wait"];
const short = a => a ? a.slice(0,6)+"…"+a.slice(-4) : "";

async function sha256(s){if(!window.crypto?.subtle){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return "0x"+h.toString(16).padStart(8,"0")}
  const h=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return "0x"+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("");}

async function genPersona(brief, seed){
  const r = await fetch("/api/rush",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"spawn",...brief,seed})});
  const d = await r.json();
  if(!r.ok||d.error) throw new Error(d.error||"Spawn failed");
  const p = d.persona; p.id = seed;
  p.fp = await sha256(JSON.stringify({name:p.name,handle:p.handle,voice:p.voice,personality:p.personality,disclosure:p.disclosure,owner:brief.ownerName}));
  return p;
}

function Field(){
  const [go,setGo]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setGo(true),400);return()=>clearTimeout(t)},[]);
  return (
    <div className={"field"+(go?" go":"")} aria-hidden="true">
      <div className="tile you"><b>You</b>one voice</div>
      {NAMES.map((n,i)=>{
        const ring=i<8?1:i<16?2:3, ang=(i/8)*Math.PI*2+ring*.4, rad=ring*14.5*5;
        const x=(Math.cos(ang)*rad).toFixed(1),y=(Math.sin(ang)*rad).toFixed(1),r=(i*37)%14-7;
        return <div key={n[0]} className={"tile c"+((i%4)+1)} style={go?{opacity:1,transform:`translate(calc(-50% + ${x}%),calc(-50% + ${y}%)) rotate(${r}deg) scale(1)`,transitionDelay:(0.1+ring*0.18+(i%8)*0.03)+"s"}:{transitionDelay:(0.1+ring*0.18+(i%8)*0.03)+"s"}}><b>{n[0]}</b>{n[1]}</div>;
      })}
    </div>
  );
}

function Card({p, brief, wallet, onSign, toast}){
  const [speaking,setSpeaking]=useState(false);
  const [sig,setSig]=useState(null);
  const speak=()=>{
    const ss=window.speechSynthesis; if(!ss){toast("Voice playback isn't supported in this browser");return}
    ss.cancel();
    const u=new SpeechSynthesisUtterance(`${p.intro} ${p.posts[0]}`);
    const vs=ss.getVoices();
    const pick=vs.find(v=>/en/i.test(v.lang)&&new RegExp(p.voice.gender||"","i").test(v.name))||vs.find(v=>/en/i.test(v.lang))||vs[0];
    if(pick)u.voice=pick; u.rate=p.voice.rate||1; u.pitch=p.voice.pitch||1;
    u.onend=()=>setSpeaking(false); setSpeaking(true); ss.speak(u);
  };
  const sign=async()=>{const s=await onSign(p); if(s)setSig(s)};
  return (
    <article className="card">
      <h3>{p.name}</h3><span className="handle">{p.handle}</span>
      <span className="ai">AI persona · owned by {brief.ownerName}</span>
      <dl><dt>Sounds like</dt><dd>{p.voice.description}</dd><dt>Personality</dt><dd>{p.personality}</dd><dt>Backstory</dt><dd>{p.backstory}</dd><dt>Disclosure</dt><dd>{p.disclosure}</dd></dl>
      <div className="posts">{p.posts.map((x,i)=><div className="post" key={i}>{x}</div>)}</div>
      <div className="actions">
        <button className="btn" onClick={speak}>{speaking?"Speaking…":"Hear the voice"}</button>
        <button className="btn line" onClick={sign} disabled={!!sig}>{sig?"Signed by "+short(sig.addr):"Sign with wallet"}</button>
      </div>
      <div className="fp"><b>Fingerprint</b> {p.fp}{sig&&<div className="signed">Ownership claimed by {short(sig.addr)}</div>}</div>
    </article>
  );
}

class Boundary extends React.Component{
  constructor(p){super(p);this.state={err:null}}
  static getDerivedStateFromError(e){return {err:e}}
  render(){return this.state.err?<pre style={{padding:24,color:"#b00",whiteSpace:"pre-wrap",fontFamily:"monospace"}}>Rush failed to render:\n{String(this.state.err?.stack||this.state.err)}</pre>:this.props.children}
}
function RushApp(){return <Boundary><Rush/></Boundary>}

function Rush(){
  const [theme,setTheme]=useState("hero");
  const [genIn,setGenIn]=useState(false);
  const [wallet,setWallet]=useState({addr:null,chain:null,signed:0,fp:"—",sig:"—"});
  const [owner,setOwner]=useState("brand");
  const [f,setF]=useState({ownerName:"",niche:"",tone:"Warm and direct",goal:""});
  const [busy,setBusy]=useState(false);
  const [status,setStatus]=useState("");
  const [deck,setDeck]=useState([]);
  const [toastMsg,setToastMsg]=useState("");
  const [wl,setWl]=useState({email:"",role:"brand",note:""});
  const [wlDone,setWlDone]=useState(false);
  const [doc,setDoc]=useState("overview");
  const [wlCount,setWlCount]=useState(null);
  const toastT=useRef();
  const refs=useRef({});

  const toast=m=>{setToastMsg(m);clearTimeout(toastT.current);toastT.current=setTimeout(()=>setToastMsg(""),3200)};

  useEffect(()=>{
    const obs=[];
    THEMES.forEach(k=>{const el=refs.current[k];if(!el||typeof IntersectionObserver==="undefined")return;
      const o=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setTheme(k)}),{rootMargin:"-45% 0px -45% 0px"});o.observe(el);obs.push(o)});
    if(typeof IntersectionObserver==="undefined"){setGenIn(true);return()=>obs.forEach(o=>o.disconnect())}
    const g=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setGenIn(true)}),{threshold:.2});if(refs.current.gen)g.observe(refs.current.gen);obs.push(g);
    window.speechSynthesis?.getVoices();
    (async()=>{try{const r=await fetch("/api/rush");const d=await r.json();if(typeof d.count==="number")setWlCount(d.count)}catch(e){}})();
    return()=>obs.forEach(o=>o.disconnect());
  },[]);

  const connect=async()=>{
    const eth=window.ethereum;
    if(!eth){toast("No wallet found. Open this page in a browser with MetaMask or a wallet app.");return null}
    try{
      const [addr]=await eth.request({method:"eth_requestAccounts"});
      const chain=await eth.request({method:"eth_chainId"});
      setWallet(w=>({...w,addr,chain}));toast("Wallet connected");
      eth.on?.("accountsChanged",a=>setWallet(w=>({...w,addr:a[0]||null})));
      eth.on?.("chainChanged",c=>setWallet(w=>({...w,chain:c})));
      return addr;
    }catch(e){toast("Connection cancelled");return null}
  };

  const onSign=async p=>{
    let addr=wallet.addr; if(!addr){addr=await connect(); if(!addr)return null}
    const msg=`Rush persona registry\nfingerprint: ${p.fp}\nname: ${p.name}\ndisclosed: AI persona\nowner: ${addr}`;
    try{
      const sig=await window.ethereum.request({method:"personal_sign",params:[msg,addr]});
      setWallet(w=>({...w,signed:w.signed+1,fp:p.fp,sig}));toast("Persona registered to your wallet");
      return {addr,sig};
    }catch(e){toast("Signature cancelled");return null}
  };

  const joinWaitlist=async()=>{
    const email=wl.email.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast("Enter a valid email address");return}
    try{
      const r=await fetch("/api/rush",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"waitlist",email,role:wl.role,note:wl.note,wallet:wallet.addr})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.error||"failed");
      if(typeof d.count==="number") setWlCount(d.count);
      setWlDone(true);
    }catch(e){toast("Couldn't save your spot. Try again in a moment.")}
  };

  const spawn=async n=>{
    const brief={owner,...f,ownerName:f.ownerName.trim(),niche:f.niche.trim(),goal:f.goal.trim()};
    if(!brief.ownerName||!brief.niche){setStatus("Add a name and a niche first.");return}
    setBusy(true);setStatus(n>1?"Spawning three variants…":"Spawning…");
    const res=await Promise.allSettled(Array.from({length:n},(_,i)=>genPersona(brief,Date.now()+i)));
    const ok=res.filter(r=>r.status==="fulfilled").map(r=>({p:r.value,brief}));
    setDeck(d=>[...ok,...d]);
    setStatus(ok.length?`${ok.length} persona${ok.length>1?"s":""} ready. Hear it, then sign it to claim ownership.`:"Something went wrong: "+(res[0].reason?.message||"try again"));
    setBusy(false);
  };

  const set=k=>e=>setF(v=>({...v,[k]:e.target.value}));
  const ref=k=>el=>{refs.current[k]=el};
  const go=k=>refs.current[k]?.scrollIntoView({behavior:"smooth",block:"start"});

  return (
    <div className="rush" data-t={theme}>
      <style>{css}</style>
      <nav className="nav">
        <button className="mark" onClick={()=>go("hero")}>R<i>u</i>sh</button>
        <ul>{[["who","Who it's for"],["gen","Spawn a persona"],["reg","Registry"],["docs","Docs"],["wait","Waitlist"]].map(([k,t])=><li key={k}><button className="navlink" onClick={()=>go(k)}>{t}</button></li>)}</ul>
        <button className="wallet" onClick={connect}>{wallet.addr?short(wallet.addr):"Connect wallet"}</button>
      </nav>

      <section className="hero" id="top" ref={ref("hero")}>
        <div>
          <h1><span>Everyone has</span><span>a voice.</span><span className="many">We give you</span><span className="many">all of them.</span></h1>
          <p>Rush turns one voice into a network of AI personas — each with its own name, sound, personality and story, each clearly labeled as AI, each owned by you on a public ledger. Reach every niche without cloning yourself a hundred times over.</p>
          <button className="cta" onClick={()=>go("gen")}>Spawn your first persona</button>
          <button className="cta ghost" onClick={()=>go("reg")}>See how ownership works</button>
        </div>
        <Field/>
      </section>

      <section className="band" ref={ref("band")}>
        <div className="wrap">
          <h2>Scaling used to mean hiring. Now it means multiplying.</h2>
          <div>
            <p>Attention is harder to earn and audiences expect to be spoken to directly. The old answer was bigger teams and more agencies. Rush replaces that with presence: launch a product with a persona for runners, one for gamers, one for new parents, one for the CFO who reads at 6am — all live at once, all on message, all around the clock.</p>
            <p>Every persona is customizable. Test a tone, watch what lands, scale the ones that work and retire the ones that don't. Growth stops being a headcount problem.</p>
          </div>
        </div>
      </section>

      <section className="who" id="who" ref={ref("who")}>
        <div className="wrap">
          <h2>Built for brands and for the person who is the brand.</h2>
          <div className="cols">
            <div className="col">
              <span className="tag">For brands</span>
              <h3>A voice for every audience</h3>
              <p>Instead of briefing five influencers, deploy fifty branded AI ambassadors — each tuned to a niche, each disclosed as yours. Product education, community replies, launch chatter, support that sounds human at 3am.</p>
              <ul><li>Niche-specific ambassadors from a single brand brief</li><li>Shared memory so every persona knows the product</li><li>Approval flows and kill switches for the whole fleet</li><li>Ownership recorded on-chain under your company wallet</li></ul>
            </div>
            <div className="col">
              <span className="tag">For creators</span>
              <h3>Be a network, not a bottleneck</h3>
              <p>Replicate your voice and personality into AI versions of you that answer DMs, run niche channels and keep posting while you sleep — tagged as your AI, so your audience always knows what's you and what's your team.</p>
              <ul><li>Voice and personality cloned from your own content</li><li>Consistency at volume, without burning out</li><li>You approve what your personas say, or let them run</li><li>Personas are yours to keep, transfer or license</li></ul>
            </div>
          </div>
        </div>
      </section>

      <section className={"gen"+(genIn?" in":"")} id="spawn" ref={ref("gen")}>
        <div className="wrap">
          <h2>Spawn a persona.</h2>
          <p className="lead">Describe who it's for and what it's for. Rush writes the identity — name, voice, personality, backstory, sample posts — then reads it aloud and stamps it with a fingerprint you can sign.</p>
          <div className="genGrid">
            <div className="form">
              <label>Who owns this persona
                <div className="seg" role="group">
                  <button type="button" aria-pressed={owner==="brand"} onClick={()=>setOwner("brand")}>A brand</button>
                  <button type="button" aria-pressed={owner==="creator"} onClick={()=>setOwner("creator")}>A creator</button>
                </div>
              </label>
              <label>Brand or creator name<input value={f.ownerName} onChange={set("ownerName")} placeholder="e.g. Kettle Coffee, or your own name"/></label>
              <label>Niche or audience<input value={f.niche} onChange={set("niche")} placeholder="e.g. ultrarunners, indie game devs, first-time founders"/></label>
              <label>Tone<select value={f.tone} onChange={set("tone")}>
                {["Warm and direct","Dry and funny","Hype, high energy","Calm expert","Blunt contrarian"].map(t=><option key={t}>{t}</option>)}
              </select></label>
              <label>What should this persona do<textarea rows={2} value={f.goal} onChange={set("goal")} placeholder="e.g. answer product questions and post daily tips"/></label>
              <div className="row">
                <button className="btn" disabled={busy} onClick={()=>spawn(1)}>Spawn one</button>
                <button className="btn line" disabled={busy} onClick={()=>spawn(3)}>Spawn three variants</button>
              </div>
              <div className="status" aria-live="polite">{status}</div>
            </div>
            <div className="deck">
              {deck.length===0 && <div className="empty">No personas yet. Fill in the brief and spawn one — it takes about ten seconds. Each persona you make here is disclosed as AI and belongs to whoever signs it.</div>}
              {deck.map(({p,brief})=><Card key={p.id} p={p} brief={brief} wallet={wallet} onSign={onSign} toast={toast}/>)}
            </div>
          </div>
        </div>
      </section>

      <section className="reg" id="registry" ref={ref("reg")}>
        <div className="wrap">
          <div>
            <h2>Every persona carries a receipt.</h2>
            <p>The moment a persona is spawned, Rush hashes its identity — name, voice profile, personality, disclosure — into a fingerprint. Sign that fingerprint with your wallet and it becomes a public claim: this persona is AI, and it belongs to this address.</p>
            <p>Anyone can verify it. Nobody can quietly rebrand a persona as a real person. And because ownership is a signature, personas can be transferred, licensed or sold like any other digital asset.</p>
            <button className="cta" onClick={connect}>{wallet.addr?short(wallet.addr):"Connect wallet"}</button>
          </div>
          <div className="ledger">
            <div className="line"><span className="k">Wallet</span><span className={wallet.addr?"ok":"warn"}>{wallet.addr||"Not connected"}</span></div>
            <div className="line"><span className="k">Network</span><span>{wallet.addr?(CHAINS[wallet.chain]||"Chain "+parseInt(wallet.chain,16)):"—"}</span></div>
            <div className="line"><span className="k">Personas signed</span><span>{wallet.signed}</span></div>
            <div className="line"><span className="k">Last fingerprint</span><span>{wallet.fp}</span></div>
            <div className="line"><span className="k">Last signature</span><span>{wallet.sig}</span></div>
          </div>
        </div>
      </section>

      <section className="docs" ref={ref("docs")}>
        <div className="wrap">
          <h2>Documentation</h2>
          <p className="lead">How Rush works, what a persona is, and how ownership, payments and licensing fit together.</p>
          <div className="docGrid">
            <nav className="docNav" aria-label="Documentation topics">
              {DOCS.map(x=><button key={x.id} aria-current={doc===x.id} onClick={()=>setDoc(x.id)}>{x.t}</button>)}
            </nav>
            <article className="docBody" key={doc}>
              <h3>{DOCS.find(x=>x.id===doc).t}</h3>
              {DOCS.find(x=>x.id===doc).body.map((blk,i)=>{
                const [k,v]=blk;
                if(k==="p")return <p key={i}>{v}</p>;
                if(k==="h")return <h4 key={i}>{v}</h4>;
                if(k==="l")return <ul key={i}>{v.map((li,j)=><li key={j}>{li}</li>)}</ul>;
                if(k==="c")return <pre key={i}>{v}</pre>;
                return null;
              })}
              <div className="docFoot">
                {DOCS.findIndex(x=>x.id===doc)<DOCS.length-1 && <button className="btn line" onClick={()=>setDoc(DOCS[DOCS.findIndex(x=>x.id===doc)+1].id)}>Next: {DOCS[DOCS.findIndex(x=>x.id===doc)+1].t}</button>}
              </div>
            </article>
          </div>
        </div>
      </section>

      <section className="wait" ref={ref("wait")}>
        <div className="wrap">
          <h2>Get in before the rush.</h2>
          <p className="sub">We're onboarding a small group of brands and creators first. Leave your email and we'll tell you when your spot opens.{wlCount!=null&&wlCount>0&&<> {wlCount.toLocaleString()} {wlCount===1?"person is":"people are"} already on the list.</>}</p>
          {wlDone ? (
            <div className="wlDone"><b>You're on the list.</b> We'll email {wl.email.trim()} when it's your turn. Connect a wallet above if you want your personas registered to it from day one.</div>
          ) : (
            <div className="wlForm">
              <input type="email" value={wl.email} onChange={e=>setWl(v=>({...v,email:e.target.value}))} placeholder="you@company.com" aria-label="Email address" onKeyDown={e=>e.key==="Enter"&&joinWaitlist()}/>
              <div className="seg dark" role="group">
                {[["brand","I run a brand"],["creator","I'm a creator"],["agency","I'm an agency"]].map(([k,t])=><button type="button" key={k} aria-pressed={wl.role===k} onClick={()=>setWl(v=>({...v,role:k}))}>{t}</button>)}
              </div>
              <input value={wl.note} onChange={e=>setWl(v=>({...v,note:e.target.value}))} placeholder="What would you build with Rush? (optional)" aria-label="Note"/>
              <button className="cta" onClick={joinWaitlist}>Join the waitlist</button>
            </div>
          )}
        </div>
      </section>

      <footer className="foot">
        <div className="wrap">
          <div className="mark">R<i>u</i>sh</div>
          <p>Rush personas are always disclosed as AI and always traceable to an owner. That's not a limitation — it's the reason people will keep listening to them. Identity at scale, with a receipt.</p>
        </div>
      </footer>

      <div className={"toast"+(toastMsg?" show":"")} role="status">{toastMsg}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<RushApp/>);

</script>
</body>
</html>
